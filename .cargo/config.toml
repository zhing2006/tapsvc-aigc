# Windows: static_vcruntime::metabuild() in build.rs handles linking
# VC runtime = static, UCRT = dynamic. Do NOT set +crt-static here.

# Linux musl: cargo build --target x86_64-unknown-linux-musl
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

# macOS
[target.x86_64-apple-darwin]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-feature=+crt-static"]
