name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary: tapsvc-aigc.exe
            asset: tapsvc-aigc-skill-win32-x64.zip
            archive: zip
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            binary: tapsvc-aigc
            asset: tapsvc-aigc-skill-linux-x64.tar.gz
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            binary: tapsvc-aigc
            asset: tapsvc-aigc-skill-linux-arm64.tar.gz
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            binary: tapsvc-aigc
            asset: tapsvc-aigc-skill-darwin-x64.tar.gz
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            binary: tapsvc-aigc
            asset: tapsvc-aigc-skill-darwin-arm64.tar.gz
            archive: tar.gz

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (macOS)
        if: startsWith(matrix.target, 'x86_64-apple') || startsWith(matrix.target, 'aarch64-apple')
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Build (Windows / Linux x64)
        if: matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package skill (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p tapsvc-aigc/scripts
          cp -r skills/tapsvc-aigc/SKILL.md tapsvc-aigc/
          cp -r skills/tapsvc-aigc/references tapsvc-aigc/
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} tapsvc-aigc/scripts/
          chmod +x tapsvc-aigc/scripts/${{ matrix.binary }}
          tar czf ${{ matrix.asset }} tapsvc-aigc/

      - name: Package skill (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p tapsvc-aigc/scripts
          cp skills/tapsvc-aigc/SKILL.md tapsvc-aigc/
          cp -r skills/tapsvc-aigc/references tapsvc-aigc/
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} tapsvc-aigc/scripts/

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path tapsvc-aigc -DestinationPath ${{ matrix.asset }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          files=()
          for dir in artifacts/*/; do
            for file in "$dir"*; do
              [ -f "$file" ] && files+=("$file")
            done
          done
          gh release create "$tag" "${files[@]}" \
            --title "$tag" \
            --generate-notes
