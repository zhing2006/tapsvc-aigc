name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary: tapsvc-aigc.exe
            asset: tapsvc-aigc-skill-win32-x64.zip
            archive: zip
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            binary: tapsvc-aigc
            asset: tapsvc-aigc-skill-linux-x64.tar.gz
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            binary: tapsvc-aigc
            asset: tapsvc-aigc-skill-linux-arm64.tar.gz
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            binary: tapsvc-aigc
            asset: tapsvc-aigc-skill-darwin-x64.tar.gz
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            binary: tapsvc-aigc
            asset: tapsvc-aigc-skill-darwin-arm64.tar.gz
            archive: tar.gz

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --version 0.2.5 --locked

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (macOS)
        if: startsWith(matrix.target, 'x86_64-apple') || startsWith(matrix.target, 'aarch64-apple')
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'

      - name: Build (Windows / Linux x64)
        if: matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify static VCRuntime
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw "vswhere could not locate a VS install with VC tools" }
          $dumpbin = Get-ChildItem -Path "$vsRoot\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -ErrorAction Stop |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "dumpbin.exe not found under $vsRoot" }
          $imports = & $dumpbin /imports $exe 2>&1 | Out-String
          $bad = "vcruntime140.dll", "msvcr"
          $hits = $bad | Where-Object { $imports -match [regex]::Escape($_) }
          if ($hits) {
            Write-Error "Dynamic VCRuntime imports found: $($hits -join ', ')"
            exit 1
          }

      - name: Smoke test (--help)
        if: matrix.target != 'aarch64-unknown-linux-musl' && matrix.target != 'aarch64-apple-darwin'
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.binary }} --help

      - name: Package skill (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p tapsvc-aigc/scripts
          cp skills/tapsvc-aigc/SKILL.md tapsvc-aigc/
          cp -R skills/tapsvc-aigc/references tapsvc-aigc/
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} tapsvc-aigc/scripts/
          chmod +x tapsvc-aigc/scripts/${{ matrix.binary }}
          tar czf ${{ matrix.asset }} tapsvc-aigc/

      - name: Package skill (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p tapsvc-aigc/scripts
          cp skills/tapsvc-aigc/SKILL.md tapsvc-aigc/
          cp -R skills/tapsvc-aigc/references tapsvc-aigc/
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} tapsvc-aigc/scripts/

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path tapsvc-aigc -DestinationPath ${{ matrix.asset }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          files=()
          for dir in artifacts/*/; do
            for file in "$dir"*; do
              [ -f "$file" ] && files+=("$file")
            done
          done
          gh release create "$tag" "${files[@]}" \
            --title "$tag" \
            --generate-notes
